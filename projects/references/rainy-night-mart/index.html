<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =========================================================
   雨夜便利店街角 · 三渲二微缩场景
   全部几何与贴图程序化生成，无任何外部资产（仅 three.js）
   ========================================================= */

// ---------- 基础 ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0a0f1e, 30, 120);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.5, 400);
camera.position.set(16.5, 11.5, 18.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.9, 0);
// 调试机位（URL hash：#cam=x,y,z,tx,ty,tz）
try {
  const hp = new URLSearchParams(location.hash.slice(1));
  if (hp.get('cam')){
    const [cx, cy, cz, tx, ty, tz] = hp.get('cam').split(',').map(Number);
    camera.position.set(cx, cy, cz);
    controls.target.set(tx, ty, tz);
  }
} catch (e) {}
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.minDistance = 7;
controls.maxDistance = 60;
controls.minPolarAngle = 0.15;
controls.maxPolarAngle = 1.42;

// ---------- 工具 ----------
function rand(a, b){ return a + Math.random() * (b - a); }
function ease(k){ return k * k * (3 - 2 * k); }

// 赛璐璐四阶渐变
const gradData = new Uint8Array([70,70,70,255, 130,130,130,255, 190,190,190,255, 255,255,255,255]);
const gradMap = new THREE.DataTexture(gradData, 4, 1);
gradMap.minFilter = gradMap.magFilter = THREE.NearestFilter;
gradMap.needsUpdate = true;

const OUT = new THREE.MeshBasicMaterial({ color: 0x0d1020, side: THREE.BackSide });
function withOutline(m, s = 1.04){
  const o = new THREE.Mesh(m.geometry, OUT);
  o.scale.setScalar(s);
  m.add(o);
  return m;
}
function toon(color, o = {}){
  return new THREE.MeshToonMaterial(Object.assign({ color, gradientMap: gradMap }, o));
}
function box(parent, w, h, d, mat, x = 0, y = 0, z = 0, ry = 0, out = 1.04, shadow = true){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  if (ry) m.rotation.y = ry;
  m.castShadow = shadow;
  if (out) withOutline(m, out);
  parent.add(m);
  return m;
}
function cyl(parent, rt, rb, h, mat, x = 0, y = 0, z = 0, seg = 14, out = 1.06, shadow = true){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
  m.position.set(x, y, z);
  m.castShadow = shadow;
  if (out) withOutline(m, out);
  parent.add(m);
  return m;
}
function tube(parent, a, b, r, mat, out = 1.08){
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 10), mat);
  m.position.copy(a).addScaledVector(dir, 0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  m.castShadow = true;
  if (out) withOutline(m, out);
  parent.add(m);
  return m;
}
function canvasTex(w, h, draw){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}
const FONT = '"Yu Gothic UI","Yu Gothic","Meiryo","Microsoft YaHei",sans-serif';
function rrect(g, x, y, w, h, r){
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

    g.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.07)';

    for (let s = 0; s < 6; s++){ x += rand(-28, 28); y += rand(-28, 28); g.lineTo(x, y); }

function pickPuddle(){
  const tot = puddles.reduce((a, p) => a + p.w, 0);
  let r = Math.random() * tot;
  for (const p of puddles){ r -= p.w; if (r <= 0) return p; }
  return puddles[0];
}

// ---------- 雨 ----------
function makeRain(n, x0, x1, z0, z1, yMax, spMin, spMax, len, op, col, drift){
  const pos = new Float32Array(n * 6);
  const drops = [];
  for (let i = 0; i < n; i++)
    drops.push({ x: rand(x0, x1), y: rand(0.5, yMax), z: rand(z0, z1), sp: rand(spMin, spMax) });
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.LineBasicMaterial({ color: col, transparent: true, opacity: op, depthWrite: false });
  const lines = new THREE.LineSegments(geo, mat);
  lines.frustumCulled = false;
  scene.add(lines);
  return {
    update(dt){
      for (let i = 0; i < n; i++){
        const d = drops[i];
        d.y -= d.sp * dt;
        d.x += drift[0] * dt;
        d.z += drift[1] * dt;
        if (d.y < 0.1){
          d.y = yMax; d.x = rand(x0, x1); d.z = rand(z0, z1); d.sp = rand(spMin, spMax);
        }
        const dx = drift[0] / d.sp, dz = drift[1] / d.sp;
        const m = 1 / Math.sqrt(1 + dx * dx + dz * dz);
        pos[i * 6] = d.x; pos[i * 6 + 1] = d.y; pos[i * 6 + 2] = d.z;
        pos[i * 6 + 3] = d.x + dx * len * m;
        pos[i * 6 + 4] = d.y - len * m;
        pos[i * 6 + 5] = d.z + dz * len * m;
      }
      geo.attributes.position.needsUpdate = true;
    }
  };
}
const rainA = makeRain(850, -16, 16, -16, 16, 9.5, 8.5, 13, 0.55, 0.3, 0x9db8dd, [-1.1, 0.7]);
const rainB = makeRain(60, -9, 9, -9, 9, 8, 14, 18, 1.15, 0.5, 0xc2d8f5, [-1.1, 0.7]);

// ---------- 玻璃水痕 ----------
function makeDrops(w = 256, h = 512, n = 26){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const drops = [];
  for (let i = 0; i < n; i++)
    drops.push({ x: Math.random() * w, y: Math.random() * h, len: 12 + Math.random() * 40, sp: 8 + Math.random() * 22, wd: 0.8 + Math.random() * 1.6, ph: Math.random() * 6 });
  let last = 0;
  return {
    tex,
    step(now){
      if (now - last < 90) return;
      last = now;
      g.clearRect(0, 0, w, h);
      g.lineCap = 'round';
      for (const d of drops){
        d.y += d.sp * 0.09;
        if (d.y - d.len > h){ d.y = -d.len; d.x = Math.random() * w; d.sp = 8 + Math.random() * 22; }
        g.strokeStyle = 'rgba(205,228,255,0.5)';
        g.lineWidth = d.wd;
        g.beginPath();
        g.moveTo(d.x, d.y - d.len);
        g.quadraticCurveTo(d.x + Math.sin(d.ph) * 2.5, d.y - d.len * 0.4, d.x, d.y);
        g.stroke();
        g.fillStyle = 'rgba(230,244,255,0.75)';
        g.beginPath(); g.arc(d.x, d.y, d.wd * 0.9, 0, 6.283); g.fill();
      }
      tex.needsUpdate = true;
    }
  };
}

const dropMatS = new THREE.MeshBasicMaterial({ map: dropsS.tex, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false });
const dropMatE = new THREE.MeshBasicMaterial({ map: dropsE.tex, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false });

// ---------- 动效状态 ----------
const doorState = { state: 'closed', t: 0, next: rand(8, 16), off: 0 };
function updateDoor(dt){
  doorState.t += dt;
  let k = 0;
  if (doorState.state === 'closed'){
    doorState.off = 0;
    if (doorState.t >= doorState.next){ doorState.state = 'opening'; doorState.t = 0; }
  } else if (doorState.state === 'opening'){
    k = Math.min(doorState.t / 1.4, 1);
    doorState.off = ease(k) * 0.72;
    if (k >= 1){ doorState.state = 'open'; doorState.t = 0; doorState.next = rand(4, 7); }
  } else if (doorState.state === 'open'){
    doorState.off = 0.72;
    if (doorState.t >= doorState.next){ doorState.state = 'closing'; doorState.t = 0; }
  } else if (doorState.state === 'closing'){
    k = Math.min(doorState.t / 1.4, 1);
    doorState.off = ease(1 - k) * 0.72;
    if (k >= 1){ doorState.state = 'closed'; doorState.t = 0; doorState.next = rand(14, 28); }
  }
  doorL.position.x = -3.37 - doorState.off;
  doorR.position.x = -2.63 + doorState.off;
}
const flicks = [];
function addFlick(apply, base, waitMin = 2, waitMax = 7){
  flicks.push({ apply, base, wait: rand(waitMin, waitMax), dipT: 0, level: base });
}
addFlick(v => { signMatS.emissiveIntensity = v; signMatE.emissiveIntensity = v; }, 0.85);
addFlick(v => { v24Mat.color.setScalar(v); neonL.intensity = 7 * v; }, 1, 3, 8);
addFlick(v => { window.__vendMat.emissiveIntensity = v; }, 0.25, 4, 10);
addFlick(v => { window.__coneMat.opacity = 0.09 * v; lampL.intensity = 11 * v; }, 1, 6, 13);
function updateFlicks(dt){
  for (const f of flicks){
    if (f.dipT > 0){
      f.dipT -= dt;
      f.apply(f.level);
      if (f.dipT <= 0){ f.apply(f.base); f.wait = rand(2, 7); }
    } else {
      f.wait -= dt;
      if (f.wait <= 0){
        f.dipT = 0.04 + Math.random() * 0.08;
        f.level = f.base * (0.4 + Math.random() * 0.3);
        f.wait = rand(2, 7);
      }
    }
  }
}
const trafState = { t: 0 };
function updateTraffic(dt){
  trafState.t = (trafState.t + dt) % 12;
  const ph = trafState.t < 5.5 ? 'g' : trafState.t < 7 ? 'y' : 'r';
  window.__trG.material.color.set(ph === 'g' ? 0x43e08a : 0x14261c);
  window.__trY.material.color.set(ph === 'y' ? 0xffc94d : 0x2a2314);
  window.__trR.material.color.set(ph === 'r' ? 0xff5252 : 0x261414);
  const c = ph === 'g' ? 0x43e08a : ph === 'y' ? 0xffc94d : 0xff5252;
  trafL.color.set(c);
  trafL.intensity = 3.5;
  trafPoolMat.color.set(c);
}
let ripTimer = 0;
function updateRainRipples(dt){
  ripTimer -= dt;
  if (ripTimer <= 0){
    ripTimer = 0.05 + Math.random() * 0.14;
    const p = pickPuddle();
    const a = Math.random() * Math.PI * 2;
    const rr = Math.sqrt(Math.random());
    spawnRipple(p.x + p.rx * rr * Math.cos(a), p.z + p.rz * rr * Math.sin(a), p.y, 0.6 + Math.random() * 0.8);
  }
}
function updateRipples(dt){
  for (const r of ripples){
    if (!r.on) continue;
    r.age += dt;
    const k = r.age / 0.9;
    if (k >= 1){ r.on = false; r.m.visible = false; continue; }
    const sc = (0.05 + 0.5 * k) * r.s;
    r.m.position.set(r.x, r.y, r.z);
    r.m.scale.set(sc, sc, 1);
    r.m.material.opacity = (1 - k) * (1 - k) * 0.45;
  }
}
function updateDrips(dt){
  for (const d of drips){
    if (!d.on){
      d.t -= dt;
      if (d.t <= 0){ d.on = true; d.t = 0; d.mesh.visible = true; }
    } else {
      d.t += dt;
      const k = Math.min(d.t / d.dur, 1);
      const y = d.y0 - (d.y0 - 0.12) * k * k;
      d.mesh.position.set(d.x, y, d.z);
      if (k >= 1){
        d.on = false;
        d.t = rand(0.8, 2.6);
        d.mesh.visible = false;
        spawnRipple(d.x, d.z, 0.1, 1.2);
      }
    }
  }
}
function updateSteam(t){
  for (const st of steams){
    const k = ((t * 0.25) + st.ph) % 1;
    st.s.position.set(st.bx + Math.sin(t * 1.4 + st.ph * 7) * 0.07, 1.42 + k * 1.15, st.bz);
    st.s.material.opacity = Math.sin(Math.PI * k) * 0.3;
    const sc = 0.35 + 0.6 * k;
    st.s.scale.set(sc, sc, 1);
  }
}

// ---------- 主循环 ----------
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const timeScale = reduce ? 0.25 : 1;
const clock = new THREE.Clock();
let t = 0;
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05) * timeScale;
  t += dt;
  rainA.update(dt);
  rainB.update(dt);
  updateRainRipples(dt);
  updateRipples(dt);
  updateDrips(dt);
  updateDoor(dt);
  updateFlicks(dt);
  updateTraffic(dt);
  updateSteam(t);
  dropsS.step(performance.now());
  dropsE.step(performance.now());
  wires.rotation.z = Math.sin(t * 0.45) * 0.004;
  wires.rotation.x = Math.cos(t * 0.4) * 0.002;
  starMat.opacity = 0.5 + 0.15 * Math.sin(t * 0.6);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;

});
